
name: Build FF AutoPilot APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'FF-AutoPilot-Source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o FF-AutoPilot-Source.zip -d extracted
          test -f extracted/FF-AutoPilot/app/build.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: extracted/FF-AutoPilot
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FF-AutoPilot-APK
          path: extracted/FF-AutoPilot/app/build/outputs/apk/debug/app-debug.apk
          
